    <!-- MathJax 3 Configuration for Inline and Display Math -->
    <script>
      window.MathJax = {
        loader: {
          load: [
            '[tex]/ams',
            '[tex]/newcommand',
            '[tex]/noerrors',
            '[tex]/noundefined'
          ]
        },
        tex: {
          inlineMath: [
            ['$', '$'],
            ['\\(', '\\)']
          ],
          displayMath: [
            ['$$', '$$'],
            ['\\[', '\\]']
          ],
          processEscapes: true,
          processEnvironments: true,
          packages: {
            '[+]': [
              'ams',
              'newcommand',
              'noerrors',
              'noundefined'
            ]
          }
        },
        options: {
          skipHtmlTags: [
            'script',
            'noscript',
            'style',
            'textarea',
            'pre',
            'code'
          ]
        },
        chtml: {
          scale: 1.05,
          matchFontHeight: true,
          displayAlign: 'center'
        },
        startup: {
          typeset: false,
          ready: () => {
            if (window.MathJax) {
              window.MathJax.startup.defaultReady();
              window.dispatchEvent(new Event('mathjax-ready'));
            }
          }
        }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
